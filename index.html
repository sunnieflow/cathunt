<script>
const STRINGS={
  kr:{subtitle:'쥐를 잡아라!',control:'좌/우 탭: 레인 이동  |  가운데 탭: 점프',jumpHint:'발자국 = 점프로 피하기!',play:'사냥 시작',retry:'다시 사냥',best:'최고',pts:'점',phases:['적응','속도 UP','혼돈','최고 난이도'],combo:'콤보',bonus:'배율',gameOver:'게임 오버',livesOut:'목숨 소진',rec:'REC',laneL:'왼쪽',laneC:'점프',laneR:'오른쪽',hitMsg:'피격!',deadMsg:'OUT!',mouseName:['일반 쥐','황금 쥐','희귀 쥐'],rareBanner:'희귀 쥐 등장!'},
  en:{subtitle:'Catch the mice!',control:'Left/Right: lane  |  Center tap: jump',jumpHint:'Pawprint = Jump to dodge!',play:'HUNT',retry:'RETRY',best:'Best',pts:'pts',phases:['Warm-up','Speed Up','Chaos','MAX'],combo:'COMBO',bonus:'BONUS',gameOver:'GAME OVER',livesOut:'No lives left',laneL:'L',laneC:'JUMP',laneR:'R',hitMsg:'HIT!',deadMsg:'OUT!',mouseName:['Mouse','Gold Mouse','RARE'],rareBanner:'RARE MOUSE!'}
};
let lang='en';
function T(k){return STRINGS[lang][k]||'';}
function setLang(l){
  lang=l;
  document.getElementById('btn-kr').className='lang-btn '+(l==='kr'?'selected':'unselected');
  document.getElementById('btn-en').className='lang-btn '+(l==='en'?'selected':'unselected');
  applyStrings();
}
function applyStrings(){
  const ids={'startBtn':'play','t-subtitle':'subtitle','t-control':'control','t-jump-hint':'jumpHint'};
  for(const [id,key] of Object.entries(ids)){const el=document.getElementById(id);if(el)el.textContent=T(key);}
  const hs=document.getElementById('hs-txt');
  if(hs&&highScore>0)hs.textContent=T('best')+': '+Math.floor(highScore).toLocaleString()+' '+T('pts');
}

const gc=document.getElementById('gc'),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const LANES=3,MAX_LIVES=3;
let W,H,LW,LX=[],groundY,jumpPeak;
let state='idle',raf;
let pLane=1,pY,pVY=0,jumping=false;
let score=0,combo=0,comboT=0,highScore=parseInt(localStorage.getItem('cathunt_hs')||'0');
let lives=MAX_LIVES,hitInvince=0;
let deathAnim=0,deathAngle=0,deathY=0,deathLane=1;
let timeLeft=0,lastTS=0,spawnAcc=0;
let spd=3,baseSpd=3;
let objs=[],parts=[],floats=[];
let obstacleCooldown=0;
let stars=[],bgY=0;
let catF=0,catAcc=0;
let shX=0,shY=0;
let flashA=0,flashR=255,flashG=80,flashB=80;
let phase=0;
let rareBanner=0;
let bgRed=0;
let comboFlash=0,comboFlashMult=0,rareFlash=0;


function resize(){
  const r=gc.getBoundingClientRect();
  W=cv.width=Math.round(r.width);H=cv.height=Math.round(r.height);
  LW=W/LANES;for(let i=0;i<LANES;i++)LX[i]=LW*i+LW/2;
  groundY=H*0.79;jumpPeak=H*0.44;pY=groundY;if(!stars.length)makeStars();
}
function makeStars(){stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+0.2,sp:Math.random()*0.5+0.1,tw:Math.random()*Math.PI*2});}

function startGame(){
  try{getAudio();}catch(e){}
  ov.style.display='none';
  state='playing';score=0;combo=0;comboT=0;timeLeft=0;lastTS=0;spawnAcc=0;
  lives=MAX_LIVES;hitInvince=0;deathAnim=0;
  spd=baseSpd=2.8;objs=[];parts=[];floats=[];
  pLane=1;pY=groundY;pVY=0;jumping=false;shX=0;shY=0;flashA=0;phase=0;obstacleCooldown=0;
  rareBanner=0;bgRed=0;
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  const hh=document.getElementById('hud-hint');
  const hh1=document.getElementById('hh1');
  const hh2=document.getElementById('hh2');
  if(hh&&hh1&&hh2){
    hh1.textContent=T('control');hh2.textContent=T('jumpHint');
    hh.style.transition='none';hh.style.opacity='1';
    setTimeout(()=>{hh.style.transition='opacity 1.2s ease';hh.style.opacity='0';},1500);
  }
}

let lastObsLanes=[];
function spawnRate(){return[180,150,120,90][phase];}
function makePattern(elapsed){
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  let count;
  if(elapsed<30)count=1;
  else if(elapsed<60)count=Math.random()<0.5?2:1;
  else count=Math.random()<0.7?2:1;
  const prevWasDouble=lastObsLanes.length>=2;
  const prevSafeLane=prevWasDouble?[0,1,2].find(l=>!lastObsLanes.includes(l)):-1;
  const allCombos1=[[0],[1],[2]];
  const allCombos2=[[0,1],[0,2],[1,2]];
  let chosen;
  if(count===2){
    const diff=allCombos2.filter(c=>JSON.stringify(c)!==JSON.stringify(lastObsLanes.slice().sort()));
    const pool=diff.length>0?diff:allCombos2;
    chosen=pool[Math.floor(Math.random()*pool.length)].slice();
  } else {
    let pool=allCombos1.map(c=>c[0]);
    if(prevWasDouble&&prevSafeLane>=0)pool=pool.filter(l=>l!==prevSafeLane);
    if(lastObsLanes.length===1)pool=pool.filter(l=>l!==lastObsLanes[0]);
    if(pool.length===0)pool=[0,1,2];
    chosen=[pool[Math.floor(Math.random()*pool.length)]];
  }
  lastObsLanes=chosen;return chosen;
}
function spawnPattern(lanes){lanes.forEach(l=>objs.push(makeObs('paw',l)));}
function makeMouse(kind,lane,y){return{type:'mouse',kind,lane,y:y||0,vy:spd,phase:Math.random()*Math.PI*2,wobble:0,xOff:0,pulse:1,age:0};}
function makeObs(kind,lane){return{type:'obs',kind:'paw',lane,y:-60,vy:spd,age:0};}
function getPhase(t){if(t<30)return 0;if(t<60)return 1;if(t<90)return 2;return 3;}

function spawnObj(){
  const elapsed=timeLeft;
  const r=Math.random();
  const oc=[0.35,0.45,0.55,0.65][phase];
  if(r<oc&&obstacleCooldown<=0){
    const patternLanes=makePattern(elapsed);
    spawnPattern(patternLanes);
    const gapRatio=patternLanes.length>=2?0.55:0.38;
    const minGap=patternLanes.length>=2?1200:600;
    obstacleCooldown=Math.max(minGap,(H*gapRatio/spd)*16);
    if(patternLanes.length>=2)lastObsLanes=patternLanes;
  } else {
    const freeLanes=[0,1,2].filter(l=>!lastObsLanes.includes(l));
    const lanePool=freeLanes.length>0?freeLanes:[0,1,2];
    const lane=lanePool[Math.floor(Math.random()*lanePool.length)];
    const kr=Math.random();
    const rareChance=timeLeft<20?0.18:0.06;
    const k=kr<rareChance?'rare':kr<rareChance+0.28?'gold':'basic';
    objs.push(makeMouse(k,lane,-30));
  }
}

let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(freq,type,vol,dur,fadeOut){try{const ac=getAudio();const o=ac.createOscillator();const g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);g.gain.setValueAtTime(vol,ac.currentTime);if(fadeOut)g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);o.start(ac.currentTime);o.stop(ac.currentTime+dur);}catch(e){}}
function playChord(freqs,vol,dur){freqs.forEach((f,i)=>setTimeout(()=>playTone(f,'sine',vol,dur,true),i*60));}
function sfx(kind){
  try{
    const ac=getAudio();
    if(kind==='jump'){playTone(440,'sine',0.12,0.06,true);setTimeout(()=>playTone(550,'sine',0.1,0.06,true),50);}
    else if(kind==='land'){playTone(200,'sine',0.08,0.05,true);}
    else if(kind==='basic'){playTone(520,'sine',0.18,0.08,true);}
    else if(kind==='gold'){playChord([660,880],0.2,0.18);}
    else if(kind==='rare'){playChord([880,1100,1320,1540],0.25,0.35);}
    else if(kind==='combo5'){playChord([440,550,660],0.22,0.25);}
    else if(kind==='combo10'){playChord([440,550,660,880],0.28,0.4);}
    else if(kind==='combo20'){playChord([440,550,660,880,1100],0.32,0.5);}
    else if(kind==='hit'){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';o.frequency.setValueAtTime(180,ac.currentTime);o.frequency.exponentialRampToValueAtTime(60,ac.currentTime+0.15);g.gain.setValueAtTime(0.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.15);o.start();o.stop(ac.currentTime+0.15);}
    else if(kind==='death'){[300,240,180,120].forEach((f,i)=>setTimeout(()=>playTone(f,'sawtooth',0.25,0.18,true),i*120));}
    else if(kind==='gameover'){[440,330,220,110].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.2,0.25,true),i*180));}
  }catch(e){}
}

function addFloat(x,y,txt,col,big){floats.push({x,y,vy:big?-2.2:-1.6,life:big?1200:900,txt,col,big:!!big});}
function spawnParts(x,y,kind){
  const cols={basic:['#cccccc','#aaaaaa'],gold:['#ffd060','#ffb820','#fff8a0'],rare:['#cc88ff','#ff88cc','#ffffff','#ffccff'],hit:['#ff4444','#ff8800'],death:['#ff4444','#ff88aa','#ffffff']};
  const c=cols[kind]||cols.basic;
  const n=kind==='death'?22:kind==='rare'?28:kind==='gold'?16:10;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=Math.random()*(kind==='death'?5:kind==='rare'?5.5:kind==='gold'?4:3)+1;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(kind==='death'?4:kind==='rare'?4.5:3),life:kind==='death'?1000:kind==='rare'?1000:800,col:c[Math.floor(Math.random()*c.length)],r:Math.random()*(kind==='rare'?6:kind==='gold'?4:3.5)+1.5});
  }
}

function takeDamage(ox,oy){
  if(hitInvince>0)return;
  lives--;hitInvince=2000;
  shX=14;shY=10;flashA=0.7;flashR=255;flashG=30;flashB=30;
  combo=0;comboT=0;
  sfx('hit');
  addFloat(LX[pLane],pY-50,T('hitMsg'),'#ff4444');
  spawnParts(ox,oy,'hit');
  if(lives<=0){
    deathAnim=1;deathAngle=0;deathY=pY;deathLane=pLane;
    spawnParts(LX[pLane],pY,'death');
    addFloat(LX[pLane],pY-60,T('deadMsg'),'#ff2222');
    sfx('death');
    setTimeout(()=>endGame(),1400);
    state='dying';
  }
}

function loop(ts){
  if(state==='idle')return;
  const rawDt=lastTS?Math.min(ts-lastTS,50):16;lastTS=ts;
  const dt=rawDt;
  if(state==='dying'){
    deathAnim=Math.min(1,deathAnim+rawDt/1200);deathAngle+=rawDt*0.012;deathY=Math.min(groundY+H*0.15,deathY+rawDt*0.08);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=rawDt;if(p.life<=0)parts.splice(i,1);}
    for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y+=f.vy;f.life-=rawDt;if(f.life<=0)floats.splice(i,1);}
    drawDying();raf=requestAnimationFrame(loop);return;
  }
  timeLeft+=rawDt/1000;
  phase=getPhase(timeLeft);
  const bonusSpd=timeLeft>90?Math.floor((timeLeft-90)/15)*0.3:0;
  const t=baseSpd*(1+phase*0.5)+bonusSpd;
  spd+=(t-spd)*0.025;
  if(timeLeft>=120)bgRed=Math.min(0.18,((timeLeft-120)/60)*0.18);
  else bgRed=Math.max(0,bgRed-rawDt/2000);
  if(comboFlash>0)comboFlash-=rawDt;
  if(rareFlash>0)rareFlash-=rawDt;
  if(obstacleCooldown>0)obstacleCooldown-=dt;
  spawnAcc+=dt;if(spawnAcc>spawnRate()){spawnObj();spawnAcc=0;}
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  if(hitInvince>0)hitInvince-=rawDt;
  if(jumping){pVY+=0.6;pY+=pVY;if(pY>=groundY){pY=groundY;pVY=0;jumping=false;sfx('land');}}
  catAcc+=dt;if(catAcc>110){catAcc=0;catF=(catF+1)%4;}
  shX*=0.82;shY*=0.82;
  if(rareBanner>0)rareBanner-=rawDt;
  bgY+=spd*0.4;
  for(let i=objs.length-1;i>=0;i--){
    const o=objs[i];o.y+=o.vy*(dt/16);o.age=(o.age||0)+dt;
    if(o.type==='mouse'){
      if(o.kind==='gold'){o.wobble=(o.wobble||0)+dt*0.006;o.xOff=Math.sin(o.wobble)*LW*0.28;}
      else if(o.kind==='rare'){o.wobble=(o.wobble||0)+dt*0.009;o.xOff=Math.sin(o.wobble)*LW*0.38;o.pulse=0.85+Math.sin(o.age*0.008)*0.18;}
      else{o.xOff=0;o.pulse=1;}
    }
    if(o.y>H+70){objs.splice(i,1);continue;}
    const sameLane=o.lane===pLane;const dy=Math.abs(o.y-pY);const ox=LX[o.lane];
    if(o.type==='mouse'){
      if(sameLane&&dy<LW*0.38){
        const pts=o.kind==='basic'?10:o.kind==='gold'?30:80;
        const getComboMult=c=>c>=20?5:c>=15?4:c>=10?3:c>=5?2:1;
        const mult=getComboMult(combo),earned=pts*mult;
        score+=earned;const prevCombo=combo;combo++;comboT=o.kind==='rare'?4000:o.kind==='gold'?3000:2000;
        spawnParts(ox,o.y,o.kind);
        const col=o.kind==='rare'?'#cc88ff':o.kind==='gold'?'#ffd060':'#cccccc';
        addFloat(ox,o.y-20,'+'+earned,col,o.kind==='rare'||o.kind==='gold');
        sfx(o.kind);
        if(o.kind==='rare'){rareFlash=400;flashA=0.35;flashR=180;flashG=50;flashB=255;}
        const newMult=getComboMult(combo),oldMult=getComboMult(prevCombo);
        if(newMult>oldMult){comboFlash=800;comboFlashMult=newMult;sfx(combo>=20?'combo20':combo>=10?'combo10':'combo5');}
        objs.splice(i,1);
      }
    } else if(o.type==='obs'){
      const atCatHeight=o.y>groundY-LW*0.5&&o.y<groundY+LW*0.3;
      const catOnGround=pY>=groundY-8;
      if(sameLane&&atCatHeight&&catOnGround&&!jumping){takeDamage(ox,o.y);objs.splice(i,1);}
      else if(o.y>groundY+LW*0.5){

        objs.splice(i,1);
      }
    }
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y+=f.vy;f.life-=dt;if(f.life<=0)floats.splice(i,1);}
  if(flashA>0)flashA=Math.max(0,flashA-dt/400);
  draw();raf=requestAnimationFrame(loop);
}

function drawDying(){
  ctx.save();ctx.fillStyle='#0b0019';ctx.fillRect(0,0,W,H);
  drawBg();drawLanes();drawObjs();
  ctx.save();ctx.translate(LX[deathLane],deathY);ctx.rotate(deathAngle);
  ctx.globalAlpha=Math.max(0,1-deathAnim*1.5);drawCatShape(LW*0.38,true);ctx.restore();
  ctx.globalAlpha=1;
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/1000);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();}
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.life/300);ctx.font='600 '+(W*0.05)+'px sans-serif';ctx.textAlign='center';ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,20,20,'+(deathAnim*0.4)+')';ctx.fillRect(0,0,W,H);
  drawHUD();ctx.restore();
}

function draw(){
  ctx.save();
  if(shX>0.5||shY>0.5)ctx.translate((Math.random()-0.5)*shX*2,(Math.random()-0.5)*shY*2);
  ctx.fillStyle='#0b0019';ctx.fillRect(0,0,W,H);
  if(bgRed>0){ctx.fillStyle='rgba(80,0,0,'+bgRed+')';ctx.fillRect(0,0,W,H);}
  drawBg();drawLanes();drawObjs();drawCat();
  ctx.globalAlpha=1;
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/800);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();}
  ctx.globalAlpha=1;
  for(const f of floats){
    const a=Math.min(1,f.life/300);ctx.globalAlpha=a;
    if(f.big){const scale=1+Math.max(0,(f.life-900)/(1200-900))*0.6;ctx.save();ctx.translate(f.x,f.y);ctx.scale(scale,scale);ctx.font='700 '+(W*0.065)+'px sans-serif';ctx.textAlign='center';ctx.fillStyle=f.col;ctx.fillText(f.txt,0,0);ctx.restore();}
    else{ctx.font='600 '+(W*0.042)+'px sans-serif';ctx.textAlign='center';ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);}
  }
  ctx.globalAlpha=1;
  if(rareFlash>0){ctx.fillStyle='rgba(160,40,255,'+(rareFlash/400*0.3)+')';ctx.fillRect(0,0,W,H);}
  if(comboFlash>0){
    const a=Math.min(1,comboFlash/200)*Math.min(1,comboFlash/800*2);
    ctx.globalAlpha=a;ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,H*0.32,W,H*0.18);
    ctx.fillStyle='#ffdd44';ctx.font='700 '+(W*0.09)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText('x'+comboFlashMult+' COMBO!',W/2,H*0.44);ctx.globalAlpha=1;
  }
  if(flashA>0){ctx.fillStyle='rgba('+flashR+','+flashG+','+flashB+','+flashA+')';ctx.fillRect(0,0,W,H);}
  if(rareBanner>0){
    ctx.globalAlpha=Math.min(1,(rareBanner/2200)*4);
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,H*0.38,W,H*0.12);
    ctx.fillStyle='#cc88ff';ctx.font='700 '+(W*0.065)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText(T('rareBanner'),W/2,H*0.455);ctx.globalAlpha=1;
  }
  drawHUD();ctx.restore();
}

function drawBg(){
  for(const s of stars){const y=((s.y+bgY*s.sp)%H+H)%H;ctx.globalAlpha=0.4+0.35*Math.sin(Date.now()/600+s.tw);ctx.beginPath();ctx.arc(s.x,y,s.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}
  ctx.globalAlpha=1;
}
function drawLanes(){
  for(let i=0;i<LANES;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.013)':'rgba(255,255,255,0.022)';ctx.fillRect(i*LW,0,LW,H);if(i>0){ctx.strokeStyle='rgba(127,119,221,0.15)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(i*LW,0);ctx.lineTo(i*LW,H);ctx.stroke();}}
  ctx.fillStyle='rgba(127,119,221,0.3)';ctx.fillRect(0,groundY+H*0.045,W,1.5);
}
function drawMouse(o){

  if(o.kind==='rare'){ctx.save();for(let i=0;i<6;i++){ctx.rotate(Math.PI*2/6);ctx.fillStyle='rgba(200,100,255,'+(0.15+Math.sin(o.age*0.01+i)*0.1)+')';ctx.beginPath();ctx.arc(s*1.6,0,s*0.4,0,Math.PI*2);ctx.fill();}ctx.restore();}

  ctx.fillStyle=earCol;
  ctx.beginPath();ctx.ellipse(-s*0.45,-s*0.9,s*0.32,s*0.4,-0.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(s*0.45,-s*0.9,s*0.32,s*0.4,0.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=innerEarCol;
  ctx.beginPath();ctx.ellipse(-s*0.45,-s*0.9,s*0.18,s*0.24,-0.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(s*0.45,-s*0.9,s*0.18,s*0.24,0.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=bodyCol;
  ctx.beginPath();ctx.ellipse(0,0,s*0.65,s*0.52,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-s*0.42,s*0.48,s*0.38,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=eyeCol;
  ctx.beginPath();ctx.arc(-s*0.22,-s*0.48,s*0.13,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.22,-s*0.48,s*0.13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.beginPath();ctx.arc(-s*0.17,-s*0.52,s*0.05,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.27,-s*0.52,s*0.05,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=noseCol;ctx.beginPath();ctx.arc(0,-s*0.22,s*0.1,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=bodyCol==='#c8c8c8'?'#999':bodyCol;ctx.lineWidth=s*0.07;

  ctx.beginPath();ctx.moveTo(-s*0.28,-s*0.1);ctx.lineTo(-s*0.5,-s*0.18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(s*0.28,-s*0.1);ctx.lineTo(s*0.5,-s*0.18);ctx.stroke();
  ctx.strokeStyle=bodyCol;ctx.lineWidth=s*0.1;

  if(o.kind==='rare'){ctx.strokeStyle='rgba(200,80,255,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,s*1.2,0,Math.PI*2);ctx.stroke();}
  ctx.restore();

function drawPaw(x,y,s,pulse){

  ctx.fillStyle='#ff7733';
  ctx.beginPath();ctx.ellipse(0,0,s*0.5,s*0.38,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='rgba(255,120,50,0.25)';ctx.beginPath();ctx.ellipse(0,s*0.45,s*0.8,s*0.18,0,0,Math.PI*2);ctx.fill();

function drawObjs(){
  for(const o of objs){

    const x=LX[o.lane],s=LW*0.22;

function drawCatShape(s,dead){
  ctx.fillStyle=dead?'#886688':'#e2c0ff';
  ctx.beginPath();ctx.ellipse(0,0,s*0.44,s*0.33,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dead?'#664466':'#d0a0f8';
  [[-0.3,-0.28,-0.42,-0.08],[0.3,-0.28,0.42,-0.08]].forEach(e=>{ctx.beginPath();ctx.moveTo(e[0]*s,e[1]*s);ctx.lineTo(0,e[1]*s*0.5);ctx.lineTo(e[2]*s,e[3]*s);ctx.closePath();ctx.fill();});
  ctx.fillStyle=dead?'#442244':'#b880ff';
  [[-0.26,-0.22,-0.21,-0.1,-0.37,-0.1],[0.26,-0.22,0.21,-0.1,0.37,-0.1]].forEach(e=>{ctx.beginPath();ctx.moveTo(e[0]*s,e[1]*s);ctx.lineTo(e[2]*s,e[3]*s);ctx.lineTo(e[4]*s,e[5]*s);ctx.closePath();ctx.fill();});
  ctx.fillStyle='#18083c';
  if(dead){
    ctx.strokeStyle='#ff4444';ctx.lineWidth=s*0.05;
    ctx.beginPath();ctx.moveTo(-s*0.22,-s*0.06);ctx.lineTo(-s*0.08,s*0.06);ctx.moveTo(-s*0.08,-s*0.06);ctx.lineTo(-s*0.22,s*0.06);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*0.22,-s*0.06);ctx.lineTo(s*0.08,s*0.06);ctx.moveTo(s*0.08,-s*0.06);ctx.lineTo(s*0.22,s*0.06);ctx.stroke();
  } else if(catF===2){
    ctx.fillRect(-s*0.22,-s*0.05,s*0.14,s*0.03);ctx.fillRect(s*0.08,-s*0.05,s*0.14,s*0.03);
  } else {
    ctx.beginPath();ctx.ellipse(-s*0.155,-s*0.02,s*0.075,s*0.092,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*0.155,-s*0.02,s*0.075,s*0.092,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,220,255,0.92)';
    ctx.beginPath();ctx.ellipse(-s*0.14,-s*0.025,s*0.038,s*0.055,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*0.14,-s*0.025,s*0.038,s*0.055,0,0,Math.PI*2);ctx.fill();
  }
  ctx.strokeStyle=dead?'#886688':'#ff9090';ctx.lineWidth=1.2;
  ctx.beginPath();
  if(dead){ctx.moveTo(-s*0.11,s*0.08);ctx.lineTo(s*0.11,s*0.08);}
  else{ctx.moveTo(-s*0.11,s*0.11);ctx.quadraticCurveTo(0,s*0.19,s*0.11,s*0.11);}
  ctx.stroke();
  ctx.fillStyle=dead?'#886688':'#c8a0ee';
  [[-s*0.3,s*0.22],[s*0.3,s*0.22],[-s*0.19,s*0.32],[s*0.19,s*0.32]].forEach(e=>{ctx.beginPath();ctx.ellipse(e[0],e[1],s*0.085,s*0.12,0,0,Math.PI*2);ctx.fill();});
  ctx.strokeStyle=dead?'#664466':'#c090f0';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(s*0.44,s*0.06);ctx.quadraticCurveTo(s*0.72,0,s*0.68,-s*0.28);ctx.stroke();
}
function drawCat(){
  ctx.save();ctx.translate(LX[pLane],pY);
  if(jumping){const ratio=(groundY-pY)/(groundY-jumpPeak);ctx.rotate(-0.25*Math.sin(ratio*Math.PI));}
  else{const bob=Math.sin(Date.now()/280)*2.2;ctx.translate(0,bob);}
  if(hitInvince>0){
    const pulse=1.15+Math.sin(Date.now()/100)*0.06;ctx.scale(pulse,pulse);
    const ringA=Math.min(1,hitInvince/1000);
    ctx.strokeStyle='rgba(255,220,0,'+ringA+')';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,LW*0.45,0,Math.PI*2);ctx.stroke();
    drawCatShape(LW*0.38,false);
    ctx.globalAlpha=ringA;ctx.fillStyle='#fff700';ctx.font='bold '+(LW*0.32)+'px sans-serif';ctx.textAlign='center';ctx.fillText('★',0,-LW*0.55);ctx.globalAlpha=1;
  } else {
    drawCatShape(LW*0.38,false);
  }
  ctx.restore();
}
function drawHeart(x,y,r,col){ctx.save();ctx.translate(x,y);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,r*0.4);ctx.bezierCurveTo(r*1.2,-r*0.6,r*2.2,r*0.8,0,r*2.2);ctx.bezierCurveTo(-r*2.2,r*0.8,-r*1.2,-r*0.6,0,r*0.4);ctx.fill();ctx.restore();}
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H*0.115);
  ctx.fillStyle='#fff';ctx.font='600 '+(W*0.058)+'px sans-serif';ctx.textAlign='left';ctx.fillText(Math.floor(score).toLocaleString(),W*0.04,H*0.072);
  ctx.fillStyle='rgba(200,180,255,0.65)';ctx.font=(W*0.027)+'px sans-serif';ctx.fillText(T('best')+': '+Math.floor(highScore).toLocaleString(),W*0.04,H*0.103);
  const hr=W*0.018;
  for(let i=0;i<MAX_LIVES;i++){const hx=W*0.97-(MAX_LIVES-1-i)*hr*2.8;ctx.globalAlpha=i<lives?1:0.2;drawHeart(hx-hr,H*0.048,hr,i<lives?'#ff4466':'#555');}
  ctx.globalAlpha=1;
  const m=Math.floor(timeLeft/60),sec=Math.floor(timeLeft%60);
  ctx.fillStyle=timeLeft>=120?'#ff5566':timeLeft>=60?'#ffc840':'#fff';
  ctx.font='600 '+(W*0.068)+'px monospace';ctx.textAlign='center';ctx.fillText(m+':'+sec.toString().padStart(2,'0'),W/2,H*0.075);
  const pCols=['#88ffcc','#ffd060','#ff8844','#ff4488'];
  ctx.fillStyle=pCols[phase];ctx.font=(W*0.027)+'px sans-serif';ctx.textAlign='center';ctx.fillText(T('phases')[phase],W/2,H*0.106);
  if(combo>=3){
    const getComboMult=c=>c>=20?5:c>=15?4:c>=10?3:c>=5?2:1;
    const mult=getComboMult(combo);
    ctx.fillStyle='#ffdd44';ctx.font='600 '+(W*0.048)+'px sans-serif';ctx.textAlign='center';ctx.fillText(combo+' '+T('combo'),W/2,H*0.16);
    if(mult>1){ctx.fillStyle='rgba(255,220,68,0.7)';ctx.font=(W*0.03)+'px sans-serif';ctx.fillText('x'+mult+' '+T('bonus'),W/2,H*0.188);}
  }
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,H*0.916,W,H*0.084);
  const bw=W*0.28;
  [[T('laneL'),0],[T('laneC'),1],[T('laneR'),2]].forEach(([t,l])=>{
    const bx=LX[l]-bw/2;
    ctx.fillStyle=l===pLane?'rgba(127,119,221,0.45)':'rgba(255,255,255,0.08)';
    ctx.beginPath();ctx.roundRect(bx+3,H*0.924,bw-6,H*0.064,7);ctx.fill();
    ctx.fillStyle=l===pLane?'#fff':'rgba(255,255,255,0.5)';
    ctx.font=(W*0.034)+'px sans-serif';ctx.textAlign='center';ctx.fillText(t,LX[l],H*0.966);
  });
  const legendY=H*0.87;

  [[T('mouseName')[0],'#c8c8c8',10],[T('mouseName')[1],'#ffd060',30],[T('mouseName')[2],'#cc88ff',80]].forEach(([name,col,pts],i)=>{
    ctx.fillStyle=col;ctx.font='500 '+(W*0.026)+'px sans-serif';ctx.textAlign='center';ctx.fillText(name+' +'+pts,LX[i],legendY);
  });
}

let touchX0=0,touchY0=0,touchT0=0,lastTouchTime=0;
gc.addEventListener('touchstart',e=>{touchX0=e.touches[0].clientX;touchY0=e.touches[0].clientY;touchT0=Date.now();},{passive:true});
gc.addEventListener('touchend',e=>{
  if(state!=='playing')return;
  lastTouchTime=Date.now();const dur=lastTouchTime-touchT0;if(dur>400)return;
  const ex=e.changedTouches[0].clientX,ey=e.changedTouches[0].clientY;
  const dx=ex-touchX0,dy=ey-touchY0;
  if(dy<-55&&Math.abs(dy)>Math.abs(dx)*2.0){doJump();return;}
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0)moveLane(-1);else moveLane(1);return;}
  const rect=gc.getBoundingClientRect();const rx=(ex-rect.left)/W;
  if(rx<0.35)moveLane(-1);else if(rx>0.65)moveLane(1);else doJump();
},{passive:true});
gc.addEventListener('click',e=>{
  if(Date.now()-lastTouchTime<300)return;
  if(state!=='playing')return;
  const rect=gc.getBoundingClientRect();const rx=(e.clientX-rect.left)/W;
  if(rx<0.35)moveLane(-1);else if(rx>0.65)moveLane(1);else doJump();
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')moveLane(-1);
  else if(e.key==='ArrowRight')moveLane(1);
  else if((e.key===' '||e.key==='ArrowUp')&&state==='playing'){e.preventDefault();doJump();}
});

function moveLane(d){if(state==='playing')pLane=Math.max(0,Math.min(LANES-1,pLane+d));}
function doJump(){if(state==='playing'&&!jumping){jumping=true;pVY=-(groundY-jumpPeak)*0.095;sfx('jump');}}

function endGame(){
  sfx('gameover');
  state='idle';if(score>highScore){highScore=score;localStorage.setItem('cathunt_hs',highScore);}cancelAnimationFrame(raf);
  const reason=T('livesOut');
  const rcol='#ff6666';
  const finalScore=Math.floor(score);
  const nickPlaceholder=lang==='kr'?'닉네임 입력':'Enter nickname';
  const submitLabel=lang==='kr'?'랭킹 등록':'Submit Score';
  ov.innerHTML=
    '<div class="ov-title">CAT HUNT</div>'+
    '<div style="font-size:clamp(9px,2.5vw,12px);color:#cc88ff;font-weight:500;letter-spacing:2px;margin-bottom:4px;opacity:0.7">냥이사냥</div>'+
    '<div class="ov-sub2">'+T('subtitle')+'</div>'+
    '<div style="font-size:clamp(20px,6vw,28px);color:#fff;font-weight:700;margin:6px 0">'+T('gameOver')+'</div>'+
    '<div style="font-size:clamp(11px,3vw,13px);color:'+rcol+';margin-bottom:4px">'+reason+'</div>'+
    '<div style="font-size:clamp(22px,7vw,30px);color:#fff;font-weight:700;margin:4px 0">'+finalScore.toLocaleString()+' '+T('pts')+'</div>'+
    '<div style="font-size:clamp(11px,3vw,13px);color:#88ffcc;margin-bottom:2px">'+(lang==='kr'?'생존시간: ':'Survived: ')+Math.floor(timeLeft/60)+'m '+Math.floor(timeLeft%60)+'s</div>'+
    
    '<div style="font-size:clamp(11px,3vw,13px);color:#9882cc">'+T('best')+': '+Math.floor(highScore).toLocaleString()+' '+T('pts')+'</div>'+
    '<div class="lang-row">'+
      '<button class="lang-btn '+(lang==='kr'?'selected':'unselected')+'" onclick="setLang(\'kr\')">한국어</button>'+
      '<button class="lang-btn '+(lang==='en'?'selected':'unselected')+'" onclick="setLang(\'en\')">English</button>'+
    '</div>'+
    '<input id="nick-input" type="text" maxlength="10" placeholder="'+nickPlaceholder+'" style="background:rgba(127,119,221,0.15);border:1px solid rgba(127,119,221,0.4);border-radius:12px;color:#fff;font-size:clamp(13px,3.5vw,16px);padding:10px 16px;text-align:center;width:200px;outline:none;margin-top:2px;">'+
    '<button class="gbtn gbtn-main" id="submitBtn" onclick="window.submitScore()" style="margin-top:6px;padding:10px 28px;font-size:clamp(12px,3.5vw,15px)">'+submitLabel+'</button>'+
    '<div id="rank-list" style="width:100%;max-width:280px;margin-top:6px;min-height:30px;text-align:center"></div>'+
    '<button class="gbtn gbtn-main" onclick="startGame()" style="margin-top:8px">'+T('retry')+'</button>';
  ov.style.display='flex';
  function renderRanking(scores){
    const el=document.getElementById('rank-list');if(!el)return;
    if(!scores||scores.length===0){el.innerHTML='<div style="color:#5a4a7a;font-size:11px">'+(lang==='kr'?'아직 기록 없음':'No records yet')+'</div>';return;}
    el.innerHTML='<div style="color:#fac775;font-size:11px;font-weight:700;margin-bottom:4px">🏆 TOP 10</div>'+
      scores.map((s,i)=>'<div style="display:flex;justify-content:space-between;padding:2px 10px;font-size:clamp(10px,2.5vw,12px);color:'+(i===0?'#ffd060':i===1?'#cccccc':i===2?'#cd7f32':'#9882cc')+'">'+
        '<span>'+(i+1)+'. '+s.nickname+'</span><span>'+Math.floor(s.score).toLocaleString()+'</span></div>').join('');
  }
  if(window.getTopScores)window.getTopScores().then(renderRanking);
  window.submitScore=async function(){
    const nickEl=document.getElementById('nick-input');const btn=document.getElementById('submitBtn');
    if(!nickEl||!btn)return;
    const nick=nickEl.value.trim();if(!nick){nickEl.style.borderColor='#ff4444';return;}
    btn.textContent=lang==='kr'?'저장 중...':'Saving...';btn.disabled=true;
    if(window.saveScore)await window.saveScore(nick,finalScore);
    btn.textContent=lang==='kr'?'등록 완료 ✓':'Saved ✓';btn.style.background='#44aa66';
    if(window.getTopScores)window.getTopScores().then(renderRanking);
  };
}

document.getElementById('startBtn').onclick=startGame;
new ResizeObserver(resize).observe(gc);
resize();applyStrings();
</script>
